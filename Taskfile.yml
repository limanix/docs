# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3.53.1'

includes:
  terraform:
    taskfile: https://raw.githubusercontent.com/mr-chelyshkin/tasks/v0.0.3/taskfiles/terraform/Taskfile.yml
    vars:
      TERRAFORM_VERSION: '1.15.9'
      CONTAINER_ENVS: >-
        AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_REGION AWS_DEFAULT_REGION
        TF_VAR_aws_region TF_VAR_domain_name TF_VAR_site_bucket_name TF_VAR_acm_certificate_arn
  python:
    taskfile: https://raw.githubusercontent.com/mr-chelyshkin/tasks/v0.0.3/taskfiles/python/Taskfile.yml
    internal: true

tasks:
  ci/terraform-fmt:
    desc: Check Terraform formatting
    cmds:
      - task: terraform:fmt

  ci/terraform-validate:
    desc: Validate Terraform without initializing the state backend
    cmds:
      - task: terraform:validate

  ci/terraform-plan:
    desc: Run Terraform plan
    requires:
      vars: [TF_STATE_BUCKET, TF_STATE_KEY, TF_STATE_REGION]
    cmds:
      - task: terraform:plan
        vars:
          INIT_ARGS: >-
            -input=false -reconfigure -lockfile=readonly
            -backend-config=use_lockfile=true
            -backend-config=encrypt=true
            {{printf "-backend-config=bucket=%s" .TF_STATE_BUCKET | shellQuote}}
            {{printf "-backend-config=region=%s" .TF_STATE_REGION | shellQuote}}
            {{printf "-backend-config=key=%s" .TF_STATE_KEY | shellQuote}}

  docs/serve:
    desc: Serve docs locally
    vars:
      docs_port: '{{.DOCS_PORT | default "8050"}}'
      docs_projects: '{{.DOCS | default ""}}'
    preconditions:
      - sh: |
          {{range (.docs_projects | splitArgs)}}
          {{- $path := . -}}
          {{- if not (isAbs $path) -}}{{- $path = joinPath $.ROOT_DIR $path | absPath -}}{{- end}}
          test -f {{printf "%s/docs/index.md" $path | shellQuote}} || exit 1
          {{end}}
          true
        msg: Each DOCS directory must contain docs/index.md.
    cmds:
      - task: python:_uv/tool
        vars:
          CONTAINER_PORTS: '127.0.0.1:{{.docs_port}}:{{.docs_port}}'
          CONTAINER_ENVS: PYTHONUNBUFFERED=1 TINI_KILL_PROCESS_GROUP=1
          CONTAINER_VOLUMES: >-
            {{range $index, $path := (.docs_projects | splitArgs)}}
            {{if not (isAbs $path)}}{{$path = joinPath $.ROOT_DIR $path | absPath}}{{end}}
            {{printf "%s:/local-projects/%d:ro" $path $index | shellQuote}}
            {{end}}
          CMD: >-
            uv run --locked --group docs python docs/preview.py
            --port {{.docs_port | shellQuote}}
            {{range $index, $path := (.docs_projects | splitArgs)}}
            {{if not (isAbs $path)}}{{$path = joinPath $.ROOT_DIR $path | absPath}}{{end}}
            --project {{base $path | shellQuote}} {{printf "/local-projects/%d" $index | shellQuote}}
            {{end}}

  ci/docs:
    desc: Build static docs
    cmds:
      - task: python:_uv/tool
        vars:
          CMD: >-
            uv run --locked --group docs sphinx-build
            -E -W --keep-going -b html -c docs docs/pages build/docs
