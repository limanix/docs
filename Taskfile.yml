# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3.53.1'

includes:
  terraform:
    taskfile: https://raw.githubusercontent.com/mr-chelyshkin/tasks/v0.0.3/taskfiles/terraform/Taskfile.yml
    vars:
      TERRAFORM_VERSION: '1.15.9'
      CONTAINER_ENVS: >-
        AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_REGION AWS_DEFAULT_REGION
        TF_VAR_aws_region TF_VAR_domain_name TF_VAR_site_bucket_name TF_VAR_acm_certificate_arn
  python:
    taskfile: https://raw.githubusercontent.com/mr-chelyshkin/tasks/v0.0.3/taskfiles/python/Taskfile.yml
    internal: true

tasks:
  ci/terraform-fmt:
    desc: Check Terraform formatting
    cmds:
      - task: terraform:fmt

  ci/terraform-validate:
    desc: Validate Terraform without initializing the state backend
    cmds:
      - task: terraform:validate

  ci/terraform-plan:
    desc: Run Terraform plan
    requires:
      vars: [TF_STATE_BUCKET, TF_STATE_KEY, TF_STATE_REGION]
    cmds:
      - task: terraform:plan
        vars:
          INIT_ARGS: >-
            {{printf "-backend-config=bucket=%s" .TF_STATE_BUCKET | shellQuote}}
            {{printf "-backend-config=region=%s" .TF_STATE_REGION | shellQuote}}
            {{printf "-backend-config=key=%s" .TF_STATE_KEY | shellQuote}}
            -input=false -reconfigure -lockfile=readonly
            -backend-config=use_lockfile=true
            -backend-config=encrypt=true
            
  ci/docs:
    desc: Build static
    vars:
      docs_projects: '{{.DOCS | default ""}}'
      docs_output: '{{.DOCS_OUTPUT | default "build/docs"}}'
    preconditions: &docs_preconditions
      - sh: |
          {{range (.docs_projects | splitArgs)}}
          test -f {{joinPath . "docs/index.md" | shellQuote}} || exit 1
          {{end}}
          true
        msg: Each DOCS directory must contain docs/index.md.
    cmds:
      - task: python:_uv/tool
        vars:
          CONTAINER_ENVS: CLIENT_TAG MODULES_TAG
          CONTAINER_VOLUMES: &docs_volumes >-
            {{range $project := (.docs_projects | splitArgs)}}
            {{if not (isAbs $project)}}{{$project = joinPath $.ROOT_DIR $project | absPath}}{{end}}
            {{printf "%s/docs:/workspace/docs/pages/projects/%s:ro" $project (base $project) | shellQuote}}
            {{end}}
          CMD: >-
            uv run --locked --group docs sphinx-build
            -E -W --keep-going -b html -c docs docs/pages {{.docs_output | shellQuote}}

  docs/serve:
    desc: Serve static
    vars:
      docs_projects: '{{.DOCS | default ""}}'
      docs_port: '{{.DOCS_PORT | default "8040"}}'
    preconditions: *docs_preconditions
    cmds:
      - task: python:_uv/tool
        vars:
          CONTAINER_PORTS: '127.0.0.1:{{.docs_port}}:{{.docs_port}}'
          CONTAINER_ENVS: PYTHONUNBUFFERED=1 TINI_KILL_PROCESS_GROUP=1
          CONTAINER_VOLUMES: *docs_volumes
          CMD: >-
            uv run --locked --group docs sphinx-autobuild
            --host 0.0.0.0 --port {{.docs_port | shellQuote}}
            --watch docs --pre-build 'rm -rf /tmp/limanix-docs-preview'
            -E -a -W --keep-going -c docs docs/pages /tmp/limanix-docs-preview
