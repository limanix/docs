# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3.53.1'
silent: true

includes:
  terraform:
    taskfile: https://raw.githubusercontent.com/mr-chelyshkin/tasks/v0.0.4/taskfiles/terraform/Taskfile.yml
    internal: true
    vars:
      TERRAFORM_VERSION: '1.15.9'
      CONTAINER_ENVS: >-
        AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_REGION AWS_DEFAULT_REGION
        TF_VAR_aws_region TF_VAR_domain_name TF_VAR_site_bucket_name TF_VAR_acm_certificate_arn
  python:
    taskfile: https://raw.githubusercontent.com/mr-chelyshkin/tasks/v0.0.4/taskfiles/python/Taskfile.yml
    internal: true

vars:
  CLIENT_ROOT:  '{{.CLIENT_ROOT  | default ""}}'
  CLIENT_DOCS:  '{{.CLIENT_DOCS  | default ""}}'
  CLIENT_TAG:   '{{.CLIENT_TAG   | default ""}}'
  MODULES_ROOT: '{{.MODULES_ROOT | default ""}}'
  MODULES_DOCS: '{{.MODULES_DOCS | default ""}}'
  MODULES_REF:  '{{.MODULES_REF  | default ""}}'

  client_docs: >-
    {{if .CLIENT_ROOT}}{{joinPath .ROOT_DIR "build/client-docs/docs.tar.gz"}}
    {{- else if isAbs .CLIENT_DOCS}}{{clean .CLIENT_DOCS}}
    {{- else if .CLIENT_DOCS}}{{joinPath .ROOT_DIR .CLIENT_DOCS}}{{end}}
  modules_docs: >-
    {{if .MODULES_ROOT}}{{joinPath .ROOT_DIR "build/modules-docs/docs.tar.gz"}}
    {{- else if isAbs .MODULES_DOCS}}{{clean .MODULES_DOCS}}
    {{- else if .MODULES_DOCS}}{{joinPath .ROOT_DIR .MODULES_DOCS}}{{end}}

  archive_tasks: '{{if .CLIENT_ROOT}}_docs/archive/client {{end}}{{if .MODULES_ROOT}}_docs/archive/modules{{end}}'

  docs_volumes: >-
    {{with .client_docs}}{{printf "%s:/inputs/client:ro" (dir .) | shellQuote}}{{end}}
    {{with .modules_docs}}{{printf "%s:/inputs/modules:ro" (dir .) | shellQuote}}{{end}}
  docs_prepare: >-
    python scripts/build_docs.py
    {{with .client_docs}}--client-docs {{printf "/inputs/client/%s" (base .) | shellQuote}}{{end}}
    {{with .modules_docs}}--modules-docs {{printf "/inputs/modules/%s" (base .) | shellQuote}}{{end}}

tasks:
  ci/terraform-fmt:
    desc: Run Tf fmt check
    cmds:
      - task: terraform:fmt

  ci/terraform-validate:
    desc: Run Tf validate
    cmds:
      - task: terraform:validate

  ci/terraform-plan:
    desc: Run Tf plan
    requires:
      vars: [TF_STATE_BUCKET, TF_STATE_KEY, TF_STATE_REGION]
    cmds:
      - task: terraform:plan
        vars:
          INIT_ARGS: >-
            {{printf "-backend-config=bucket=%s" .TF_STATE_BUCKET | shellQuote}}
            {{printf "-backend-config=region=%s" .TF_STATE_REGION | shellQuote}}
            {{printf "-backend-config=key=%s" .TF_STATE_KEY | shellQuote}}
            -input=false -reconfigure -lockfile=readonly
            -backend-config=use_lockfile=true
            -backend-config=encrypt=true

  ci/static-build:
    desc: Build docs
    vars:
      output: '{{.DOCS_OUTPUT | default "build/docs"}}'
      build: |
        {{.docs_prepare}} --clean-output {{.output | shellQuote}}
        exec sphinx-build -E -W --keep-going -b html -c docs build/docs-pages {{.output | shellQuote}}
    cmds:
      - task: _docs/inputs
      - task: python:_uv/tool
        vars:
          CMD: uv run --locked --group docs sh -eu -c {{.build | shellQuote}}
          CONTAINER_ENVS: CLIENT_TAG MODULES_TAG
          CONTAINER_VOLUMES: '{{.docs_volumes}}'

  ci/static-audit:
    desc: Run Python audit
    cmds:
      - task: python:_uv/tool
        vars:
          CMD: uv audit --locked --preview-features audit-command

  ci/static-test:
    desc: Run Python checks
    cmds:
      - task: python:fmt
        vars:
          FMT_ARGS: --check scripts docs/conf.py
      - task: python:lint
        vars:
          LINT_ARGS: scripts docs/conf.py

  docs/serve:
    desc: Serve docs with live rebuilds
    cmds:
      - task: _docs/inputs
      - task: _docs/live

  _docs/inputs:
    internal: true
    preconditions:
      - sh: test -z {{.CLIENT_ROOT | shellQuote}} || test -z {{.CLIENT_DOCS | shellQuote}}
        msg: Set CLIENT_ROOT or CLIENT_DOCS, not both.
      - sh: test -z {{.CLIENT_ROOT | shellQuote}} || test -d {{.CLIENT_ROOT | shellQuote}}
        msg: CLIENT_ROOT must be an existing directory.
      - sh: test -z {{.CLIENT_DOCS | shellQuote}} || test -e {{.client_docs | shellQuote}}
        msg: CLIENT_DOCS must be an existing directory or archive.
      - sh: test -z {{.MODULES_ROOT | shellQuote}} || test -z {{.MODULES_DOCS | shellQuote}}
        msg: Set MODULES_ROOT or MODULES_DOCS, not both.
      - sh: test -z {{.MODULES_ROOT | shellQuote}} || test -d {{.MODULES_ROOT | shellQuote}}
        msg: MODULES_ROOT must be an existing directory.
      - sh: test -z {{.MODULES_DOCS | shellQuote}} || test -e {{.modules_docs | shellQuote}}
        msg: MODULES_DOCS must be an existing directory or archive.
      - sh: test {{empty .client_docs}} = {{empty .modules_docs}}
        msg: Pass CLIENT_ROOT or CLIENT_DOCS with MODULES_ROOT or MODULES_DOCS, or omit all four.
    cmds:
      - for: { var: archive_tasks }
        task: '{{.ITEM}}'

  _docs/archive/client:
    cmds:
      - task: _docs/archive
        vars:
          PRODUCT: client
          ROOT: '{{.CLIENT_ROOT}}'
          ARGS: '{{with .CLIENT_TAG}}{{printf "RELEASE_TAG=%s" . | shellQuote}}{{end}}'

  _docs/archive/modules:
    cmds:
      - task: _docs/archive
        vars:
          PRODUCT: modules
          ROOT: '{{.MODULES_ROOT}}'
          ARGS: '{{with .MODULES_REF}}{{printf "MODULES_REF=%s" . | shellQuote}}{{end}}'

  _docs/archive:
    internal: true
    label: 'docs archive: {{.PRODUCT}}'
    requires:
      vars: [PRODUCT, ROOT]
    vars:
      archive: build/{{.PRODUCT}}-docs/docs.tar.gz
    sources:
      - '{{.ROOT}}/**/*'
      - exclude: '{{.ROOT}}/bin/**/*'
      - exclude: '{{.ROOT}}/.git/**/*'
      - exclude: '{{.ROOT}}/.idea/**/*'
      - exclude: '{{.ROOT}}/.task/**/*'
      - exclude: '{{.ROOT}}/build/**/*'
      - exclude: '{{.ROOT}}/.cache/**/*'
      - exclude: '{{.ROOT}}/**/.DS_Store'
      - exclude: '{{.ROOT}}/**/__pycache__/**/*'
      - exclude: '{{.ROOT}}/internal/nixos/resources/modules.zip'
    generates:
      - '{{.archive}}'
    status:
      - '{{if .INCREMENTAL}}true{{else}}false{{end}}'
    cmds:
      - task --yes --dir {{.ROOT | shellQuote}} docs/prepare {{.ARGS}}
      - mkdir -p {{dir .archive}}
      - COPYFILE_DISABLE=1 tar -czf {{.archive}}.tmp -C {{printf "%s/build/docs" .ROOT | shellQuote}} .
      - mv {{.archive}}.tmp {{.archive}}

  _docs/live:
    internal: true
    failfast: true
    deps: [_docs/watch, _docs/autobuild]

  _docs/watch:
    internal: true
    cmds:
      - cmd: >-
          task --watch --interval 1s {{.archive_tasks}} INCREMENTAL=true
          {{printf "CLIENT_ROOT=%s" .CLIENT_ROOT | shellQuote}} {{printf "CLIENT_TAG=%s" .CLIENT_TAG | shellQuote}}
          {{printf "MODULES_ROOT=%s" .MODULES_ROOT | shellQuote}} {{printf "MODULES_REF=%s" .MODULES_REF | shellQuote}}
        if: test -n {{.archive_tasks | shellQuote}}

  _docs/autobuild:
    internal: true
    vars:
      port: '{{.DOCS_PORT | default "8040"}}'
      watch_inputs: >-
        {{with .client_docs}}--watch {{if hasSuffix ".tar.gz" .}}/inputs/client{{else}}{{printf "/inputs/client/%s" (base .) | shellQuote}}{{end}}{{end}}
        {{with .modules_docs}}--watch {{if hasSuffix ".tar.gz" .}}/inputs/modules{{else}}{{printf "/inputs/modules/%s" (base .) | shellQuote}}{{end}}{{end}}
    cmds:
      - mkdir -p build/docs-pages
      - task: python:_uv/tool
        vars:
          CMD: >-
            uv run --locked --group docs sphinx-autobuild
            --host 0.0.0.0 --port {{.port | shellQuote}}
            --pre-build {{.docs_prepare | shellQuote}}
            --watch docs {{.watch_inputs}}
            --ignore build/docs-pages --re-ignore '\.tmp$'
            -E -a -W --keep-going -c docs build/docs-pages build/docs-preview
          CONTAINER_PORTS: '127.0.0.1:{{.port}}:{{.port}}'
          CONTAINER_ENVS: CLIENT_TAG MODULES_TAG PYTHONUNBUFFERED=1 TINI_KILL_PROCESS_GROUP=1
          CONTAINER_VOLUMES: '{{.docs_volumes}}'
