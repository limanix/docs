# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3.53.1'

includes:
  terraform:
    # v0.1.0
    taskfile: https://raw.githubusercontent.com/mr-chelyshkin/tasks/3aa8c569bdc71b41fa50fc33f66e2ef1317813ed/taskfiles/terraform/Taskfile.yml
    vars:
      TERRAFORM_DIR: tf
      CONTAINER_ENVS: >-
        AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_REGION AWS_DEFAULT_REGION
  node:
    # v0.1.0
    taskfile: https://raw.githubusercontent.com/mr-chelyshkin/tasks/3aa8c569bdc71b41fa50fc33f66e2ef1317813ed/taskfiles/node/Taskfile.yml
    vars:
      NODE_VERSION: '22.23.1'

tasks:
  run/site:
    desc: Run the site at http://localhost:5173
    cmds:
      - task: node:exec
        vars:
          NODE_DIR: site
          CONTAINER_PORTS: "127.0.0.1:5173:5173"
          CMD: "sh -c 'npm install && exec ./node_modules/.bin/vite --host 0.0.0.0 --port 5173'"

  run/docs:
    desc: Run the docs at http://localhost:5174
    cmds:
      - task: node:exec
        vars:
          NODE_DIR: docs
          CONTAINER_PORTS: "127.0.0.1:5174:5174"
          CMD: "sh -c 'npm install && exec ./node_modules/.bin/vitepress dev --host 0.0.0.0 --port 5174'"

  ci/node/build:
    desc: Lint and build APP into APP/dist
    requires: &app
      vars:
        - name: APP
          enum: [site, docs]
    cmds:
      - task: node:exec
        vars:
          NODE_DIR: '{{.APP}}'
          CMD: "sh -c 'npm ci && npm run lint && npm run build'"

  ci/node/test:
    desc: Run the tests of APP
    requires: *app
    cmds:
      - task: node:run
        vars:
          NODE_DIR: '{{.APP}}'
          SCRIPT: test

  ci/node/audit:
    desc: Audit the dependencies of APP
    requires: *app
    cmds:
      - task: node:audit
        vars:
          NODE_DIR: '{{.APP}}'

  ci/terraform/fmt:
    desc: Run terraform fmt
    cmds:
      - task: terraform:fmt

  ci/terraform/validate:
    desc: Run terraform validation
    cmds:
      - task: terraform:validate

  ci/terraform/plan:
    desc: Run terraform plan
    requires:
      vars: [TF_STATE_BUCKET, TF_STATE_KEY, TF_STATE_REGION]
    cmds:
      - task: terraform:plan
        vars:
          INIT_ARGS: >-
            -input=false -reconfigure -lockfile=readonly
            -backend-config=use_lockfile=true
            -backend-config=encrypt=true
            {{printf "-backend-config=bucket=%s" .TF_STATE_BUCKET | shellQuote}}
            {{printf "-backend-config=region=%s" .TF_STATE_REGION | shellQuote}}
            {{printf "-backend-config=key=%s" .TF_STATE_KEY | shellQuote}}
