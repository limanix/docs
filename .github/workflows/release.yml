name: Release flow

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release
  queue: max

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release tag
        uses: mr-chelyshkin/actions/tag-format-check@v2
        with:
          pattern: '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
      - name: Check release branch
        uses: mr-chelyshkin/actions/tag-branch-check@v2
        with:
          branch: main

  quality:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task: [ci/static/test, ci/static/audit, ci/static/build, ci/terraform/fmt, ci/terraform/validate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mr-chelyshkin/actions/task-run@v2
        with:
          task: ${{ matrix.task }}

  gate:
    if: always()
    needs: [verify, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: mr-chelyshkin/actions/job-results-check@v2
        with:
          results: ${{ toJSON(needs) }}

  infrastructure:
    needs: [verify, gate]
    runs-on: ubuntu-24.04
    # AWS provider 6.57.1 allows 90 minutes for CloudFront deployment.
    timeout-minutes: 100
    permissions:
      contents: read
      id-token: write
    outputs:
      distribution-id: ${{ steps.site.outputs.distribution-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Apply site infrastructure
        id: apply
        uses: mr-chelyshkin/actions/terraform-apply@v2
        env:
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_domain_name: ${{ vars.SITE_DOMAIN_NAME }}
          TF_VAR_site_bucket_name: ${{ vars.SITE_BUCKET_NAME }}
          TF_VAR_acm_certificate_arn: ${{ vars.SITE_ACM_CERTIFICATE_ARN }}
        with:
          terraform-version: '1.15.9'
          working-directory: tf
          terraform-state-bucket: ${{ vars.TF_STATE_BUCKET }}
          terraform-state-key: ${{ vars.TF_STATE_KEY }}
          terraform-state-region: ${{ vars.TF_STATE_REGION }}
      - name: Read CloudFront distribution
        id: site
        env:
          TF_OUTPUTS: ${{ steps.apply.outputs.terraform-outputs }}
        run: |
          distribution_id=$(jq -er '.cloudfront_distribution_id.value' <<< "$TF_OUTPUTS")
          printf 'distribution-id=%s\n' "$distribution_id" >> "$GITHUB_OUTPUT"

  sources:
    needs: infrastructure
    uses: ./.github/workflows/_select.yml
    permissions:
      contents: read
      id-token: write
    with:
      docs-ref: ${{ github.sha }}

  build:
    needs: sources
    uses: ./.github/workflows/_build.yml
    with:
      docs-ref: ${{ needs.sources.outputs.docs-ref }}
      client-tag: ${{ needs.sources.outputs.client-tag }}
      modules-tag: ${{ needs.sources.outputs.modules-tag }}
      artifact-name: docs-${{ needs.sources.outputs.client-tag || 'current' }}

  publish:
    needs: [infrastructure, sources, build]
    uses: ./.github/workflows/_publish.yml
    permissions:
      contents: read
      id-token: write
    with:
      distribution-id: ${{ needs.infrastructure.outputs.distribution-id }}
      docs-ref: ${{ needs.sources.outputs.docs-ref }}
      client-tag: ${{ needs.sources.outputs.client-tag }}
