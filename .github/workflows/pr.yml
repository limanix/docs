name: PR flow

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: node (${{ matrix.app }})
    strategy:
      fail-fast: false
      matrix:
        app: [site, docs]
    uses: mr-chelyshkin/actions/.github/workflows/ci-node.yml@v2
    permissions:
      contents: read
    with:
      env-vars: '{"APP": "${{ matrix.app }}"}'
      cache-key-prefix: node-${{ matrix.app }}
      cache-dependency-path: ${{ matrix.app }}/package-lock.json

  terraform:
    name: terraform (${{ matrix.app }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: site
            state-key: ${{ vars.SITE_TF_STATE_KEY }}
            domain-name: ${{ vars.SITE_DOMAIN_NAME }}
            bucket-name: ${{ vars.SITE_BUCKET_NAME }}
            certificate-arn: ${{ vars.SITE_ACM_CERTIFICATE_ARN }}
          - app: docs
            state-key: ${{ vars.DOCS_TF_STATE_KEY }}
            domain-name: ${{ vars.DOCS_DOMAIN_NAME }}
            bucket-name: ${{ vars.DOCS_BUCKET_NAME }}
            certificate-arn: ${{ vars.DOCS_ACM_CERTIFICATE_ARN }}
    uses: mr-chelyshkin/actions/.github/workflows/ci-terraform.yml@v2
    permissions:
      contents: read
      id-token: write
    with:
      aws-role-arn: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
      aws-region: ${{ vars.AWS_REGION }}
      env-vars: |
        {
          "TF_STATE_KEY": ${{ toJSON(matrix.state-key) }},
          "TF_VAR_aws_region": ${{ toJSON(vars.AWS_REGION) }},
          "TF_STATE_REGION": ${{ toJSON(vars.TF_STATE_REGION) }},
          "TF_STATE_BUCKET": ${{ toJSON(vars.TF_STATE_BUCKET) }},
          "TF_VAR_domain_name": ${{ toJSON(matrix.domain-name) }},
          "TF_VAR_site_bucket_name": ${{ toJSON(matrix.bucket-name) }},
          "TF_VAR_acm_certificate_arn": ${{ toJSON(matrix.certificate-arn) }}
        }

  gate:
    if: always()
    needs: [node, terraform]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: mr-chelyshkin/actions/job-results-check@v2
        with:
          results: ${{ toJSON(needs) }}
