name: Build documentation

on:
  workflow_call:
    inputs:
      docs-ref:
        description: Docs source commit. Empty uses this workflow's commit.
        type: string
        default: ''
      client-tag:
        description: Client release to include. Empty builds shared pages only.
        type: string
        default: ''
      modules-tag:
        description: Module release bundled with the client.
        type: string
        default: ''
      artifact-name:
        description: Artifact to upload. Empty skips the upload.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CLIENT_TAG: ${{ inputs.client-tag }}
      MODULES_TAG: ${{ inputs.modules-tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.docs-ref || github.sha }}
          persist-credentials: false
      - name: Download documentation sources
        if: inputs.client-tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/inputs/client build/inputs/modules
          gh release download "$CLIENT_TAG" --repo limanix/client \
            --pattern docs.tar.gz --dir build/inputs/client
          gh release download "$MODULES_TAG" --repo limanix/modules \
            --pattern docs.tar.gz --dir build/inputs/modules
      - name: Build shared pages
        if: inputs.client-tag == ''
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with:
          command: ci/docs
      - name: Build client documentation
        if: inputs.client-tag != ''
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with:
          command: ci/docs CLIENT_DOCS=build/inputs/client/docs.tar.gz MODULES_DOCS=build/inputs/modules/docs.tar.gz
      - name: Check generated client version
        if: inputs.client-tag != ''
        run: |
          jq -e --arg tag "$CLIENT_TAG" '.version == $tag' \
            build/docs-pages/categories/client/generated/metadata.json > /dev/null
      - name: Record source versions
        if: inputs.artifact-name != ''
        run: |
          jq -n --arg client_tag "$CLIENT_TAG" --arg modules_tag "$MODULES_TAG" \
            --arg docs_sha "$(git rev-parse HEAD)" \
            '{client_tag: $client_tag, modules_tag: $modules_tag, docs_sha: $docs_sha}' > build/docs/release.json
      - name: Upload documentation
        if: inputs.artifact-name != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: build/docs
          if-no-files-found: error
          overwrite: true
