name: Build docs

on:
  workflow_call:
    inputs:
      docs-ref:
        description: Docs source commit.
        type: string
        default: ''
      client-tag:
        description: Client release to include.
        type: string
        default: ''
      modules-tag:
        description: Module release bundled with the client.
        type: string
        default: ''
      artifact-name:
        description: Artifact to upload.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLIENT_TAG: ${{ inputs.client-tag }}
      MODULES_TAG: ${{ inputs.modules-tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.docs-ref || github.sha }}
          persist-credentials: false
      - name: Restore documentation dependencies
        uses: actions/cache@v5
        with:
          path: .cache/python
          key: docs-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: |
            docs-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}-
            docs-build-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Download client docs
        if: inputs.client-tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/inputs/client
          gh release download "$CLIENT_TAG" --repo limanix/client --pattern docs.tar.gz --dir build/inputs/client
      - name: Download modules docs
        if: inputs.client-tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/inputs/modules
          gh release download "$MODULES_TAG" --repo limanix/modules --pattern docs.tar.gz --dir build/inputs/modules
      - name: Build docs
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with:
          command: >-
            ci/static-build
            ${{ inputs.client-tag != '' && 'CLIENT_DOCS=build/inputs/client/docs.tar.gz MODULES_DOCS=build/inputs/modules/docs.tar.gz' || '' }}
      - name: Check version
        if: inputs.client-tag != ''
        run: |
          jq -e --arg tag "$CLIENT_TAG" '.version == $tag' \
            build/docs-pages/categories/client/generated/metadata.json > /dev/null
      - name: Record versions
        if: inputs.artifact-name != ''
        run: |
          jq -n --arg client_tag "$CLIENT_TAG" --arg modules_tag "$MODULES_TAG" \
            --arg docs_sha "$(git rev-parse HEAD)" \
            '{client_tag: $client_tag, modules_tag: $modules_tag, docs_sha: $docs_sha}' > build/docs/release.json
      - name: Prepare docs artifact
        if: inputs.artifact-name != ''
        env:
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
        run: |
          mkdir -p build/artifacts
          mv build/docs "build/artifacts/$ARTIFACT_NAME"
      - name: Upload docs
        if: inputs.artifact-name != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          if-no-files-found: error
          path: build/artifacts
          overwrite: true
